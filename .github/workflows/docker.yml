# Builds and pushes the Financio image to GitHub Container Registry.
# The dev machine and TrueNAS host have no Docker daemon, so CI is the build
# path: push a tag (v2.0.0) and the image lands at ghcr.io/rifi331/financio.
name: docker

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/rifi331/financio

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
      - name: Check image size (< 30 MB)
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.ref_name }}
          SIZE=$(docker inspect --format '{{.Size}}' ${{ env.IMAGE }}:${{ github.ref_name }})
          echo "image size: $SIZE bytes"
          [ "$SIZE" -lt 31457280 ]
      - name: Fail-fast check (missing env exits non-zero with clear logs)
        run: |
          set +e
          docker run --rm ${{ env.IMAGE }}:${{ github.ref_name }} > /tmp/financio.log 2>&1
          CODE=$?
          set -e
          cat /tmp/financio.log
          [ "$CODE" -ne 0 ] && grep -q "financio exited with error" /tmp/financio.log
