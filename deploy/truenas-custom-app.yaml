# Financio 2.0 — TrueNAS SCALE Custom App (Electric Eel and later).
#
# Paste-in location: TrueNAS UI → Apps → Discover Apps → Install via YAML.
# Fill the <PLACEHOLDER> values in the UI before starting — never commit
# filled values (BRIEF "Secrets policy").
#
# Single service only: the bot uses Telegram long polling, which holds the
# getUpdates lock — never scale past 1 replica.
services:
  financio:
    image: ghcr.io/rifi331/financio2.0:v2.7.0
    restart: unless-stopped
    environment:
      # --- required (fill in the TrueNAS UI) ---
      TELEGRAM_BOT_TOKEN: <TELEGRAM_BOT_TOKEN>
      OPENAI_API_KEY: <OPENAI_API_KEY>
      DATABASE_URL: <DATABASE_URL> # e.g. postgres://user:pass@host:5432/financio
      ALLOWED_USERS: <COMMA_SEPARATED_NAMES> # e.g. "Rifi Anggriawan,Jane Doe"
      DASHBOARD_TOKEN: <DASHBOARD_TOKEN> # optional; enables read-only web UI on HEALTH_PORT
      # --- optional (defaults shown) ---
      OPENAI_MODEL: gpt-6-luna
      DISPLAY_TZ: Asia/Kuala_Lumpur
      DEFAULT_CURRENCY: MYR
      HEALTH_PORT: "7777"
      LOG_LEVEL: info
    healthcheck:
      # Distroless has no shell/wget; the binary self-probes /healthz.
      test: ["CMD", "/financio", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
